<html lang="en">

<head>

<meta charset="UTF-8">

<body>

<header>

<h1>Add New Blog</h1>

</header>

<nav>

<a href="index.html">Home</a>

</nav>

<form id="blogForm">

<label>Blog Title</label>

<input
type="text"
id="title"
placeholder="Enter Blog Title"
>

<label>Author Name</label>

<input
type="text"
id="author"
placeholder="Enter Author Name"
>

<label>Blog Content</label>

<textarea
id="content"
rows="6"
placeholder="Write Blog Here"
></textarea>

<button type="submit">

Submit Blog

</button>

</form>

<footer>

<p>© 2026 My Blog Website</p>

</footer>

<script src="script.js"></script>
